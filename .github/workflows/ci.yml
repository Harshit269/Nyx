name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Laptop tests
        run: dotnet test tests/Nyx.Tests -c Release

      - name: Phone tests and lint
        working-directory: android
        shell: cmd
        run: .\gradlew.bat testDebugUnitTest lintRelease --console=plain
